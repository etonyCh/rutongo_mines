name: CI
on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - run: gradle build --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: android-debug-apk
          path: androidApp/build/outputs/apk/debug/*.apk
      - uses: actions/upload-artifact@v4
        with:
          name: web-distribution
          path: webApp/build/dist/wasmJs/productionExecutable
      - uses: actions/upload-artifact@v4
        with:
          name: server-fat-jar
          path: server/build/libs/server-all.jar
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: webApp/e2e/package-lock.json
      - name: Install web E2E dependencies
        working-directory: webApp/e2e
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Run web E2E suite
        working-directory: webApp/e2e
        run: npm run test:e2e
      - name: Upload web E2E diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: web-e2e-diagnostics
          path: |
            webApp/e2e/playwright-report
            webApp/e2e/test-results
      - name: Validate OpenAPI contract
        run: npx --yes @redocly/cli@2.76.0 lint docs/openapi.yaml
      - name: Build API reference
        run: npx --yes @redocly/cli@2.76.0 build-docs docs/openapi.yaml -o build/openapi/index.html
      - uses: actions/upload-artifact@v4
        with:
          name: openapi-reference
          path: build/openapi

  backup-restore:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: mmems
          POSTGRES_USER: mmems
          POSTGRES_PASSWORD: mmems
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U mmems -d mmems"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install --yes postgresql-client
      - name: Run backup and restore drill
        env:
          PGHOST: 127.0.0.1
          PGPORT: 5432
          PGDATABASE: mmems
          PGUSER: mmems
          PGPASSWORD: mmems
        run: |
          set -eu
          drill_dir="$(mktemp -d)"
          psql -v ON_ERROR_STOP=1 -c "create table restore_probe(value text not null); insert into restore_probe(value) values ('preserved');"
          BACKUP_DIR="$drill_dir" ops/backup.sh
          artifact="$(find "$drill_dir" -name '*.dump' -print -quit)"
          test -n "$artifact"
          test -f "$artifact.json"
          ops/restore.sh "$artifact" mmems_restore
          restored="$(psql -d mmems_restore -tAc "select value from restore_probe")"
          test "$restored" = "preserved"

  security:
    runs-on: ubuntu-24.04
    needs: build
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: mmems
          POSTGRES_USER: mmems
          POSTGRES_PASSWORD: mmems
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U mmems -d mmems"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/download-artifact@v4
        with:
          name: server-fat-jar
          path: server/build/libs
      - name: Start API
        env:
          APP_ENV: test
          HSTS_ENABLED: 'true'
          DATABASE_URL: jdbc:postgresql://127.0.0.1:5432/mmems
          DATABASE_USER: mmems
          DATABASE_PASSWORD: mmems
          BLOB_STORAGE_DIR: ${{ runner.temp }}/blobs
          PORT: '8080'
        run: |
          java -jar server/build/libs/server-all.jar > server.log 2>&1 &
          echo "$!" > server.pid
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:8080/readyz >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          cat server.log
          exit 1
      - name: Run OWASP ZAP baseline scan
        run: |
          mkdir -p zap
          chmod 777 zap
          docker run --rm --network host \
            -v "$PWD/zap:/zap/wrk:rw" \
            ghcr.io/zaproxy/zaproxy:stable \
            zap-baseline.py -t http://127.0.0.1:8080 -r zap-report.html -J zap-report.json -m 2 -I
      - name: Upload ZAP report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zap-baseline-report
          path: zap
      - name: Show API log
        if: failure()
        run: cat server.log

  load-smoke:
    runs-on: ubuntu-24.04
    needs: build
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/download-artifact@v4
        with:
          name: server-fat-jar
          path: server/build/libs
      - name: Run load smoke
        env:
          LOAD_READ_VUS: '3'
          LOAD_WRITE_VUS: '2'
          LOAD_USERS: '5'
          LOAD_DURATION: '15s'
          LOAD_PDF: 'true'
        run: ops/load/run.sh

  acceptance:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install acceptance generator dependency
        run: python -m pip install PyYAML==6.0.3
      - name: Verify acceptance checklist is current
        run: python tools/acceptance/generate_acceptance_checklist.py --check
