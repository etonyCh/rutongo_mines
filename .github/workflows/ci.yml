name: CI
on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - run: gradle build --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: android-debug-apk
          path: androidApp/build/outputs/apk/debug/*.apk
      - uses: actions/upload-artifact@v4
        with:
          name: web-distribution
          path: webApp/build/dist/wasmJs/productionExecutable
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: webApp/e2e/package-lock.json
      - name: Install web E2E dependencies
        working-directory: webApp/e2e
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Run web E2E suite
        working-directory: webApp/e2e
        run: npm run test:e2e
      - name: Upload web E2E diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: web-e2e-diagnostics
          path: |
            webApp/e2e/playwright-report
            webApp/e2e/test-results
      - name: Validate OpenAPI contract
        run: npx --yes @redocly/cli@2.76.0 lint docs/openapi.yaml
      - name: Build API reference
        run: npx --yes @redocly/cli@2.76.0 build-docs docs/openapi.yaml -o build/openapi/index.html
      - uses: actions/upload-artifact@v4
        with:
          name: openapi-reference
          path: build/openapi
