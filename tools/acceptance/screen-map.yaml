version: 1
platforms:
  web:
    title: Web console
  android:
    title: Android app

behaviors:
  loading: a busy indicator is shown and duplicate taps are ignored while the request is in flight
  disabled-busy: the control is disabled while its request is busy
  validation: missing or invalid input blocks submission and shows an inline explanation
  api-error: the server error is shown without discarding previously loaded data and retry remains available
  empty: an explicit empty state is shown and the layout does not break
  success: success feedback is shown and dependent data refreshes
  site-scope: only sites assigned to the caller are visible and changing the filter never reveals another site
  role-denied: the control is absent for roles without permission and a forged request returns 403
  conflict: a version conflict is surfaced with a review path and no data is silently overwritten
  offline-queue: the action is stored encrypted on the device with a stable client reference and retried without data loss
  offline-cache: cached data remains readable with no connection and the screen states when data was last synced
  photo-permission: camera permission denial is explained and the photo can be attached after permission is granted
  responsive: the layout remains usable at mobile, tablet, and desktop widths without clipped primary actions
  download: the downloaded file opens, has the expected format, and contains only authorised site data
  session-refresh: an expired access token is refreshed once and the original request retries without losing user input
  audit: the action is written to the immutable audit trail with actor, entity, and timestamp

global_checks:
  - id: role-matrix
    states: [role-denied]
    expected: Sign in as every role and confirm the visible web tabs and Android bottom tabs exactly match the role matrix. Direct navigation to an unauthorised screen or API must be denied.
  - id: site-scope
    states: [site-scope]
    expected: A one-site user never sees equipment, inspections, problems, maintenance, reports, imports, exports, or audit metadata from another site. A multi-site user sees only assigned sites.
  - id: session-expiry
    states: [session-refresh, api-error]
    expected: Expire the access token during a form, report action, and Android sync. The client refreshes or asks for sign-in without losing queued work or silently submitting twice.
  - id: empty-error-states
    states: [empty, api-error, loading]
    expected: For every list and dashboard, verify loading, empty, and server-error states. A failed refresh keeps the previous usable view and offers retry.
  - id: offline-work
    states: [offline-cache, offline-queue, conflict]
    expected: Put Android in airplane mode; open the app, start an inspection, record a status or breakdown, take a photo, and sign out only after the queue drains. No captured work may be lost.
  - id: concurrency
    states: [conflict]
    expected: Use two sessions to change the same maintenance, report, or breakdown record. The stale action must return 409 or 412 and offer a re-read path, never an overwrite.
  - id: audit-and-security
    states: [audit, role-denied]
    expected: Mutating actions appear in the audit trail, passwords never appear in logs or URLs, and unauthenticated requests to protected APIs return 401.
  - id: accessibility-input
    states: [responsive, validation]
    expected: Complete the core workflows using keyboard only on web and TalkBack on Android. Focus order, error announcements, labels, and touch targets must remain usable.

screens:
  - id: web-login
    platform: web
    title: Web sign in
    source: webApp/src/wasmJsMain/kotlin/rw/rutongo/mmems/web/ui/LoginScreen.kt
    roles: [MECHANIC, SUPERVISOR, MANAGER, GENERAL_MANAGER, ADMINISTRATOR]
    entry: Unauthenticated web load or expired session.
    purpose: Authenticate a user and start a refresh-cookie session.
    checks:
      - id: branding
        expected: The Rutongo brand, username and password fields, and sign-in button render without horizontal scrolling at mobile and desktop widths.
    controls:
      - id: username
        type: field
        label: Username
        states: [validation, disabled-busy]
        expected: Accepts the account username, trims surrounding spaces, and remains enabled for correction after a failed attempt.
        operations: ["POST /api/v1/auth/login"]
      - id: password
        type: field
        label: Password
        states: [validation, disabled-busy]
        expected: Masks input, supports Enter to submit, and does not retain the password after sign-out.
        operations: ["POST /api/v1/auth/login"]
      - id: sign-in
        type: button
        label: Sign in
        states: [disabled-busy, api-error, success]
        expected: Submits valid credentials, shows a busy state, and routes to the role's default tab on success.
        operations: ["POST /api/v1/auth/login", "GET /api/v1/me"]
      - id: invalid-credentials
        type: state
        label: Invalid credentials and lockout
        states: [validation, api-error]
        expected: Shows an actionable error for bad credentials or throttling and never reveals whether the username exists.
        operations: ["POST /api/v1/auth/login"]

  - id: web-change-password
    platform: web
    title: Web forced password change
    source: webApp/src/wasmJsMain/kotlin/rw/rutongo/mmems/web/ui/LoginScreen.kt
    roles: [MECHANIC, SUPERVISOR, MANAGER, GENERAL_MANAGER, ADMINISTRATOR]
    entry: Sign-in response requires a password change.
    purpose: Replace a temporary password before entering the application.
    controls:
      - id: current-password
        type: field
        label: Current password
        states: [validation, disabled-busy]
        expected: Required and checked by the server.
        operations: ["POST /api/v1/auth/change-password"]
      - id: new-password
        type: field
        label: New password
        states: [validation, disabled-busy]
        expected: Enforces the server password policy and rejects reuse of the current password.
        operations: ["POST /api/v1/auth/change-password"]
      - id: confirm-password
        type: field
        label: Confirm new password
        states: [validation]
        expected: Must match the new password before submission is allowed.
      - id: change-password
        type: button
        label: Change password
        states: [disabled-busy, api-error, success]
        expected: Changes the password, clears the forced-change state, and allows normal navigation.
        operations: ["POST /api/v1/auth/change-password"]
      - id: sign-out
        type: button
        label: Sign out
        states: [success]
        expected: Revokes the session and returns to the login screen.
        operations: ["POST /api/v1/auth/logout"]

  - id: web-shell
    platform: web
    title: Web application shell
    source: webApp/src/wasmJsMain/kotlin/rw/rutongo/mmems/web/ui/HomeShell.kt
    roles: [MECHANIC, SUPERVISOR, MANAGER, GENERAL_MANAGER, ADMINISTRATOR]
    entry: Successful sign-in or session restore.
    purpose: Provide role-aware navigation and session controls.
    checks:
      - id: role-tabs
        states: [role-denied, responsive]
        expected: Each role sees exactly its tabs, with a navigation rail on wide screens and bottom navigation on narrow screens.
    controls:
      - id: session-refresh
        type: state
        label: Automatic session refresh
        states: [session-refresh]
        expected: A rejected access token triggers one refresh attempt and the original request retries; repeated failure returns to sign-in.
        operations: ["POST /api/v1/auth/refresh"]
      - id: current-user
        type: display
        label: Current user and role badge
        expected: Shows the signed-in name and role from the profile endpoint.
        operations: ["GET /api/v1/me"]
      - id: selected-site
        type: display
        label: Active site indicator
        states: [site-scope]
        expected: The top bar reflects the active site filter and never shows another user's site.
        operations: ["GET /api/v1/sites"]
      - id: sign-out
        type: button
        label: Sign out
        states: [success]
        expected: Revokes the refresh token and returns to the login screen.
        operations: ["POST /api/v1/auth/logout"]

  - id: web-dashboard
    platform: web
    title: Web dashboard
    source: webApp/src/wasmJsMain/kotlin/rw/rutongo/mmems/web/ui/screens/DashboardScreen.kt
    roles: [MECHANIC, SUPERVISOR, MANAGER, GENERAL_MANAGER, ADMINISTRATOR]
    entry: Default tab after sign-in for non-mechanic web roles; dashboard tab for all.
    purpose: Show role-specific operational metrics and site comparison.
    controls:
      - id: refresh
        type: button
        label: Refresh
        states: [disabled-busy, api-error, success]
        expected: Reloads the role dashboard without losing the selected site.
        operations: ["GET /api/v1/dashboard/{kind}"]
      - id: site-filter
        type: filter
        label: Site filter
        states: [site-scope, empty, role-denied]
        expected: Appears for supervisors, managers, general managers, and administrators but not the mechanic dashboard; switches between authorised sites and updates the metric cards.
        operations: ["GET /api/v1/sites", "GET /api/v1/dashboard/{kind}"]
      - id: metric-cards
        type: display
        label: Metric cards
        states: [loading, empty, api-error]
        expected: Equipment, down, availability, inspections, breakdowns, maintenance, parts, reports, and inspection-rate values are labelled and consistent with the selected site.
        operations: ["GET /api/v1/dashboard/{kind}"]
      - id: site-comparison
        type: display
        label: Site comparison table
        states: [site-scope, empty]
        expected: Shows one row per authorised site and hides the table for the mechanic dashboard.
        operations: ["GET /api/v1/dashboard/{kind}"]

  - id: web-sites
    platform: web
    title: Web sites
    source: webApp/src/wasmJsMain/kotlin/rw/rutongo/mmems/web/ui/screens/SitesScreen.kt
    roles: [MANAGER, GENERAL_MANAGER]
    entry: Sites tab for manager and general manager.
    purpose: List authorised sites with roll-up metrics.
    controls:
      - id: refresh
        type: button
        label: Refresh
        states: [disabled-busy, api-error, success]
        expected: Reloads site cards and their comparison metrics.
        operations: ["GET /api/v1/sites", "GET /api/v1/dashboard/{kind}"]
      - id: site-filter
        type: filter
        label: Site filter
        states: [site-scope, empty]
        expected: Filters the card list to one site or all authorised sites.
        operations: ["GET /api/v1/sites"]
      - id: site-cards
        type: display
        label: Site cards
        states: [loading, empty, api-error]
        expected: Each card shows code, name, timezone, state, equipment, availability, breakdown, and missing-inspection metrics.
        operations: ["GET /api/v1/sites", "GET /api/v1/dashboard/{kind}"]

  - id: web-equipment
    platform: web
    title: Web equipment
    source: webApp/src/wasmJsMain/kotlin/rw/rutongo/mmems/web/ui/screens/EquipmentScreen.kt
    roles: [MECHANIC, MANAGER, GENERAL_MANAGER]
    entry: Equipment tab.
    purpose: Search the fleet register and inspect current status.
    controls:
      - id: refresh
        type: button
        label: Refresh
        states: [disabled-busy, api-error, success]
        expected: Reloads equipment while preserving the site filter and search text.
        operations: ["GET /api/v1/equipment"]
      - id: site-filter
        type: filter
        label: Site filter
        states: [site-scope, empty]
        expected: Limits visible equipment to the selected authorised site.
        operations: ["GET /api/v1/sites", "GET /api/v1/equipment"]
      - id: search
        type: filter
        label: Search asset, code, name or type
        states: [empty]
        expected: Filters by asset ID, equipment code, name, or type case-insensitively and shows a clear no-match state.
      - id: equipment-list
        type: display
        label: Equipment list
        states: [loading, empty, api-error]
        expected: Shows code, asset ID, type, site, tunnel, lifecycle, operational status, and engine hours.
        operations: ["GET /api/v1/equipment"]

  - id: web-inspections
    platform: web
    title: Web inspection control
    source: webApp/src/wasmJsMain/kotlin/rw/rutongo/mmems/web/ui/screens/InspectionsScreen.kt
    roles: [SUPERVISOR]
    entry: Inspections tab for supervisors.
    purpose: Monitor expected, missing, and completed inspections.
    controls:
      - id: refresh
        type: button
        label: Refresh
        states: [disabled-busy, api-error, success]
        expected: Reloads inspection control rows for the selected site.
        operations: ["GET /api/v1/inspections/control"]
      - id: site-filter
        type: filter
        label: Site filter
        states: [site-scope, empty]
        expected: Shows only inspection expectations for the selected authorised site.
        operations: ["GET /api/v1/sites", "GET /api/v1/inspections/control"]
      - id: inspection-list
        type: display
        label: Inspection control list
        states: [loading, empty, api-error]
        expected: Shows equipment, state, site, shift, report date, window, and missing-marked timestamp.
        operations: ["GET /api/v1/inspections/control"]

  - id: web-active-problems
    platform: web
    title: Web active problems
    source: webApp/src/wasmJsMain/kotlin/rw/rutongo/mmems/web/ui/screens/ActiveProblemsScreen.kt
    roles: [SUPERVISOR]
    entry: Active Problems tab for supervisors.
    purpose: Review equipment currently down or under repair.
    controls:
      - id: refresh
        type: button
        label: Refresh
        states: [disabled-busy, api-error, success]
        expected: Reloads active problems for the selected site.
        operations: ["GET /api/v1/active-problems"]
      - id: site-filter
        type: filter
        label: Site filter
        states: [site-scope, empty]
        expected: Limits problems to the selected authorised site.
        operations: ["GET /api/v1/sites", "GET /api/v1/active-problems"]
      - id: problem-list
        type: display
        label: Active problem cards
        states: [loading, empty, api-error]
        expected: Shows equipment, status, timestamp, reporter, problem, action, parts, and remarks.
        operations: ["GET /api/v1/active-problems", "GET /api/v1/equipment"]

  - id: web-maintenance
    platform: web
    title: Web maintenance verification
    source: webApp/src/wasmJsMain/kotlin/rw/rutongo/mmems/web/ui/screens/MaintenanceScreen.kt
    roles: [SUPERVISOR]
    entry: Maintenance tab for supervisors.
    purpose: Review maintenance records and verify or return technician work.
    controls:
      - id: refresh
        type: button
        label: Refresh
        states: [disabled-busy, api-error, success]
        expected: Reloads maintenance records for the selected site.
        operations: ["GET /api/v1/maintenance"]
      - id: site-filter
        type: filter
        label: Site filter
        states: [site-scope, empty]
        expected: Limits records to the selected authorised site.
        operations: ["GET /api/v1/sites", "GET /api/v1/maintenance"]
      - id: record-list
        type: display
        label: Maintenance record list
        states: [loading, empty, api-error, role-denied]
        expected: Shows equipment, verification state, service type, time, technician, work, cause, downtime, and notes. Decision buttons appear only for supervisors and pending records.
        operations: ["GET /api/v1/maintenance"]
      - id: verify
        type: button
        label: Verify
        states: [success, api-error]
        expected: Opens a comment dialog, verifies the record with its current version, and removes it from the pending set.
        operations: ["POST /api/v1/maintenance/{id}/verify"]
      - id: reject
        type: button
        label: Reject
        states: [validation, success, api-error]
        expected: Requires a reason, rejects with the current version, and preserves the reason in the audit trail.
        operations: ["POST /api/v1/maintenance/{id}/reject"]
      - id: request-correction
        type: button
        label: Request correction
        states: [validation, success, api-error]
        expected: Requires a reason, requests correction with the current version, and tells the technician what to fix.
        operations: ["POST /api/v1/maintenance/{id}/request-correction"]
      - id: action-dialog
        type: form
        label: Verification comment
        states: [validation, disabled-busy]
        expected: Optional for verify and mandatory for reject or correction; whitespace-only input is rejected.
        operations: ["POST /api/v1/maintenance/{id}/verify", "POST /api/v1/maintenance/{id}/reject", "POST /api/v1/maintenance/{id}/request-correction"]

  - id: web-reports
    platform: web
    title: Web daily reports
    source: webApp/src/wasmJsMain/kotlin/rw/rutongo/mmems/web/ui/screens/ReportsScreen.kt
    roles: [SUPERVISOR, MANAGER, GENERAL_MANAGER]
    entry: Reports tab or Daily report tab.
    purpose: Prepare, submit, approve, return, and download daily site reports.
    controls:
      - id: refresh
        type: button
        label: Refresh
        states: [disabled-busy, api-error, success]
        expected: Reloads report versions for the selected site.
        operations: ["GET /api/v1/reports"]
      - id: site-filter
        type: filter
        label: Site filter
        states: [site-scope, empty]
        expected: Limits reports to the selected authorised site.
        operations: ["GET /api/v1/sites", "GET /api/v1/reports"]
      - id: status-filter
        type: filter
        label: Report status filter chips
        states: [empty]
        expected: Filters reports by state and shows a clear empty result when no report matches.
        operations: ["GET /api/v1/reports"]
      - id: prepare-report
        type: button
        label: Prepare report
        states: [role-denied]
        expected: Visible only to supervisors; managers cannot create a report from this screen.
      - id: report-list
        type: display
        label: Report list
        states: [loading, empty, api-error]
        expected: Shows report reference, state, version, site, report date, and period.
        operations: ["GET /api/v1/reports"]
      - id: view-report
        type: button
        label: View
        expected: Expands the selected report snapshot, metrics, narrative, and action controls.
      - id: download-pdf
        type: button
        label: PDF and Download PDF
        states: [download, api-error]
        expected: Downloads the selected version as a PDF with the expected report reference and no other site's data.
        operations: ["GET /api/v1/reports/{id}/pdf"]
      - id: submit-report
        type: button
        label: Submit for approval
        states: [role-denied, disabled-busy, success, api-error, conflict]
        expected: Visible only to the supervisor who prepared a draft or returned report; submits using its current version and refreshes the report state.
        operations: ["POST /api/v1/reports/{id}/submit"]
      - id: approve-report
        type: button
        label: Approve
        states: [role-denied, disabled-busy, validation, success, api-error]
        expected: Visible only to managers for submitted or resubmitted reports; opens an optional comment dialog and approves using the current version.
        operations: ["POST /api/v1/reports/{id}/approve"]
      - id: return-report
        type: button
        label: Return
        states: [role-denied, disabled-busy, validation, success, api-error]
        expected: Visible only to managers for submitted or resubmitted reports; requires a correction reason and leaves the report editable by the supervisor.
        operations: ["POST /api/v1/reports/{id}/return"]
      - id: create-report-dialog
        type: form
        label: Prepare daily site report dialog
        states: [validation, disabled-busy, api-error]
        expected: Site, period, report date, executive summary, safety observations, maintenance summary, and recommendations are captured; site and date are required.
        operations: ["POST /api/v1/reports"]

  - id: web-operations
    platform: web
    title: Web operations
    source: webApp/src/wasmJsMain/kotlin/rw/rutongo/mmems/web/ui/screens/OperationsScreen.kt
    roles: [ADMINISTRATOR]
    entry: Operations tab for administrators.
    purpose: Preview and commit controlled workbook imports and download datasets.
    controls:
      - id: refresh
        type: button
        label: Refresh
        states: [disabled-busy, api-error, success]
        expected: Reloads import profiles and export datasets.
        operations: ["GET /api/v1/import-profiles", "GET /api/v1/exports"]
      - id: profile-picker
        type: filter
        label: Import profile picker
        states: [empty, disabled-busy]
        expected: Lists configured profiles and keeps the selected profile while the screen is open.
        operations: ["GET /api/v1/import-profiles"]
      - id: choose-workbook
        type: button
        label: Choose workbook
        states: [disabled-busy, validation, api-error]
        expected: Accepts only an .xlsx workbook, shows the selected file name, and surfaces rejected rows in the preview.
        operations: ["POST /api/v1/imports"]
      - id: preview-summary
        type: display
        label: Import preview summary
        states: [loading, empty, api-error]
        expected: Shows batch state, SHA-256 prefix, new, updated, unchanged, and rejected counts plus up to 100 preview rows.
        operations: ["POST /api/v1/imports"]
      - id: commit-import
        type: button
        label: Commit import
        states: [disabled-busy, success, api-error]
        expected: Commits a non-committed preview once and changes the state to committed without duplicating rows.
        operations: ["POST /api/v1/imports/{id}/commit"]
      - id: clear-preview
        type: button
        label: Clear preview
        states: [disabled-busy]
        expected: Clears the local preview without changing server data.
      - id: export-list
        type: display
        label: Dataset exports
        states: [loading, empty, api-error]
        expected: Lists only datasets allowed for the administrator role with their available formats.
        operations: ["GET /api/v1/exports"]
      - id: download-export
        type: action
        label: XLSX and CSV download buttons
        states: [download, api-error]
        expected: Downloads the selected dataset in the selected format and respects the active site scope.
        operations: ["GET /api/v1/exports/{file}"]

  - id: web-people
    platform: web
    title: Web people and audit
    source: webApp/src/wasmJsMain/kotlin/rw/rutongo/mmems/web/ui/screens/PeopleScreen.kt
    roles: [ADMINISTRATOR]
    entry: People tab for administrators.
    purpose: Administer users and inspect the immutable audit trail.
    controls:
      - id: refresh
        type: button
        label: Refresh
        states: [disabled-busy, api-error, success]
        expected: Reloads the active section, users, or audit events.
        operations: ["GET /api/v1/users", "GET /api/v1/audit-events"]
      - id: section-filter
        type: filter
        label: Users and Audit trail chips
        states: [empty]
        expected: Switches sections without losing loaded data and shows each empty state.
        operations: ["GET /api/v1/users", "GET /api/v1/audit-events"]
      - id: new-user
        type: button
        label: New user
        states: [role-denied]
        expected: Visible only in the Users section and only to administrators.
      - id: user-list
        type: display
        label: User list
        states: [loading, empty, api-error]
        expected: Shows name, active state, role, username, employee ID, and site restriction.
        operations: ["GET /api/v1/users"]
      - id: activate-deactivate
        type: button
        label: Activate or Deactivate
        states: [success, api-error, audit]
        expected: Toggles the user's active state, refreshes the list, and writes an audit event.
        operations: ["PATCH /api/v1/users/{id}/active"]
      - id: create-user-dialog
        type: form
        label: Create user dialog
        states: [validation, disabled-busy, api-error, success]
        expected: Captures username, full name, employee ID, role, initial password, and site access; duplicate usernames are rejected.
        operations: ["POST /api/v1/users", "GET /api/v1/sites"]
      - id: audit-list
        type: display
        label: Audit trail list
        states: [loading, empty, api-error, audit]
        expected: Shows action, timestamp, entity, actor, metadata, and event hash newest first.
        operations: ["GET /api/v1/audit-events"]

