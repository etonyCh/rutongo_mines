services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: mmems
      POSTGRES_USER: mmems
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-dev-only}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mmems -d mmems"]
      interval: 5s
      timeout: 3s
      retries: 10
  app:
    build:
      context: ..
      dockerfile: ops/Dockerfile
    environment:
      PORT: 8080
      DATABASE_URL: jdbc:postgresql://db:5432/mmems
      DATABASE_USER: mmems
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD:-local-dev-only}
      WEB_ORIGINS: ${WEB_ORIGINS:-http://localhost:8081,http://127.0.0.1:8081}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      FCM_CREDENTIALS: ${FCM_CREDENTIALS:-}
      BACKUP_VERIFICATION_MARKER: ${BACKUP_VERIFICATION_MARKER:-}
      BACKUP_VERIFICATION_MAX_AGE_HOURS: ${BACKUP_VERIFICATION_MAX_AGE_HOURS:-48}
    ports:
      - "8080:8080"
    volumes:
      - application_files:/app/data
    depends_on:
      db:
        condition: service_healthy
  web:
    build:
      context: ..
      dockerfile: ops/web.Dockerfile
    ports:
      - "8081:80"
    depends_on:
      - app

volumes:
  postgres_data:
  application_files:
