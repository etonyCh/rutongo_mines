components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    IfMatch:
      name: If-Match
      in: header
      required: true
      description: Current resource version, optionally quoted.
      schema:
        type: string
    Limit:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 100
    UserId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    SiteId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    SiteIdQuery:
      name: siteId
      in: query
      required: false
      schema:
        type: string
        format: uuid
    TunnelId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    EquipmentId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ImportId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    PhotoId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid

  responses:
    BadRequest:
      description: Invalid request
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
    Unauthorized:
      description: Authentication required or credentials invalid
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
    Forbidden:
      description: Role or site access denied
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
    TooManyRequests:
      description: Login rate limit exceeded
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
    PreconditionRequired:
      description: If-Match header is required
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"

