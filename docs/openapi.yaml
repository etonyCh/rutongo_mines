  /api/v1/photos:
    post:
      tags: [Photos]
      summary: Upload inspection or maintenance photo evidence
      description: Accepts JPEG or PNG files up to 10 MiB. The stored content type is derived from the file signature, not the multipart declaration.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [siteId, targetType, targetId, file]
              properties:
                siteId:
                  type: string
                  format: uuid
                targetType:
                  type: string
                  enum: [EQUIPMENT, INSPECTION_ANSWER, DEFECT, BREAKDOWN, MAINTENANCE, STATUS_EVENT]
                targetId:
                  type: string
                  format: uuid
                kind:
                  type: string
                  enum: [EVIDENCE, BEFORE, AFTER]
                  default: EVIDENCE
                photoId:
                  type: string
                  format: uuid
                  description: Client-generated identifier used to reference the photo from an offline inspection.
                file:
                  type: string
                  format: binary
      responses:
        "201":
          description: Photo stored
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PhotoView"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "413":
          description: Photo exceeds 10 MiB
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

