openapi: 3.0.3
info:
  title: Rutongo MMEMS API
  version: 1.0.0
  description: |
    Mechanical equipment management API. All endpoints except health, login,
    refresh and logout require a Bearer access token. Equipment writes use
    optimistic concurrency through If-Match; status writes also require an
    Idempotency-Key.
servers:
  - url: http://localhost:8080
security:
  - bearerAuth: []
tags:
  - name: Health
  - name: Authentication
  - name: Users
  - name: Organization
  - name: Equipment
  - name: Status
  - name: Imports
  - name: Inspections
  - name: Defects
  - name: Breakdowns
  - name: Maintenance
  - name: WorkingHours
  - name: Photos

paths:
  /health:
    get:
      tags: [Health]
      security: []
      summary: Liveness probe
      responses:
        "200":
          description: Service is running
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok

  /api/v1/auth/login:
    post:
      tags: [Authentication]
      security: []
      summary: Authenticate a user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Session created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /api/v1/auth/refresh:
    post:
      tags: [Authentication]
      security: []
      summary: Rotate an access token
      description: WEB clients send the refresh cookie and CSRF headers; mobile clients send refreshToken in the body.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RefreshRequest"
      responses:
        "200":
          description: Session refreshed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/v1/auth/logout:
    post:
      tags: [Authentication]
      security: []
      summary: Revoke a refresh token and clear the refresh cookie
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LogoutRequest"
      responses:
        "204":
          description: Session revoked

  /api/v1/auth/change-password:
    post:
      tags: [Authentication]
      summary: Change the current user's password
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChangePasswordRequest"
      responses:
        "204":
          description: Password changed
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/v1/me:
    get:
      tags: [Authentication]
      summary: Return the authenticated user
      responses:
        "200":
          description: Current user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserView"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/v1/users:
    get:
      tags: [Users]
      summary: List users
      responses:
        "200":
          description: Users
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/UserView"
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      tags: [Users]
      summary: Create a user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateUserRequest"
      responses:
        "201":
          description: User created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserView"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          description: Username or employee ID already exists
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /api/v1/users/{id}:
    put:
      tags: [Users]
      summary: Update a user
      parameters:
        - $ref: "#/components/parameters/UserId"
        - $ref: "#/components/parameters/IfMatch"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateUserRequest"
      responses:
        "200":
          description: User updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserView"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          description: Version conflict or duplicate user key
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /api/v1/users/{id}/active:
    patch:
      tags: [Users]
      summary: Activate or deactivate a user
      parameters:
        - $ref: "#/components/parameters/UserId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SetUserActiveRequest"
      responses:
        "204":
          description: User activation changed
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/audit-events:
    get:
      tags: [Users]
      summary: List recent audit events
      parameters:
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Audit events
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  additionalProperties:
                    type: string
                    nullable: true
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/v1/sites:
    get:
      tags: [Organization]
      summary: List authorized sites
      responses:
        "200":
          description: Sites
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SiteView"
    post:
      tags: [Organization]
      summary: Create a site
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateSiteRequest"
      responses:
        "201":
          description: Site created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SiteView"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          description: Site code already exists
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /api/v1/sites/{id}:
    put:
      tags: [Organization]
      summary: Update a site
      parameters:
        - $ref: "#/components/parameters/SiteId"
        - $ref: "#/components/parameters/IfMatch"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateSiteRequest"
      responses:
        "200":
          description: Site updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SiteView"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: Version conflict
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /api/v1/tunnels:
    get:
      tags: [Organization]
      summary: List tunnels
      parameters:
        - $ref: "#/components/parameters/SiteIdQuery"
      responses:
        "200":
          description: Tunnels
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TunnelView"
        "400":
          $ref: "#/components/responses/BadRequest"
    post:
      tags: [Organization]
      summary: Create a tunnel
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateTunnelRequest"
      responses:
        "201":
          description: Tunnel created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TunnelView"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: Duplicate tunnel code
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /api/v1/tunnels/{id}:
    put:
      tags: [Organization]
      summary: Update a tunnel
      parameters:
        - $ref: "#/components/parameters/TunnelId"
        - $ref: "#/components/parameters/IfMatch"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateTunnelRequest"
      responses:
        "200":
          description: Tunnel updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TunnelView"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: Version conflict or duplicate code
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /api/v1/shifts:
    get:
      tags: [Organization]
      summary: List shifts
      responses:
        "200":
          description: Shifts
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ShiftView"

  /api/v1/shifts/{code}:
    put:
      tags: [Organization]
      summary: Rename a shift
      parameters:
        - name: code
          in: path
          required: true
          schema:
            type: string
        - $ref: "#/components/parameters/IfMatch"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateShiftRequest"
      responses:
        "200":
          description: Shift updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ShiftView"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          description: Version conflict
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /api/v1/shifts/schedules:
    get:
      tags: [Organization]
      summary: List shift schedules
      responses:
        "200":
          description: Shift schedules
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ShiftScheduleView"
    post:
      tags: [Organization]
      summary: Create a shift schedule
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateShiftScheduleRequest"
      responses:
        "201":
          description: Shift schedule created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ShiftScheduleView"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/equipment-types:
    get:
      tags: [Equipment]
      summary: List equipment types
      responses:
        "200":
          description: Equipment types
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/EquipmentTypeView"
    post:
      tags: [Equipment]
      summary: Create an equipment type
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateEquipmentTypeRequest"
      responses:
        "201":
          description: Equipment type created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EquipmentTypeView"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          description: Equipment type already exists
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /api/v1/technicians:
    get:
      tags: [Organization]
      summary: List technicians
      responses:
        "200":
          description: Technicians
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PersonnelView"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/v1/operators:
    get:
      tags: [Organization]
      summary: List operators
      responses:
        "200":
          description: Operators
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PersonnelView"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/v1/equipment:
    get:
      tags: [Equipment]
      summary: Search equipment
      parameters:
        - $ref: "#/components/parameters/SiteIdQuery"
        - name: q
          in: query
          schema:
            type: string
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Equipment matching the filters
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/EquipmentSummary"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      tags: [Equipment]
      summary: Create equipment
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateEquipmentRequest"
      responses:
        "201":
          description: Equipment created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EquipmentSummary"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: Duplicate asset or equipment code
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /api/v1/equipment/{id}:
    get:
      tags: [Equipment]
      summary: Get equipment
      parameters:
        - $ref: "#/components/parameters/EquipmentId"
      responses:
        "200":
          description: Equipment
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EquipmentSummary"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    put:
      tags: [Equipment]
      summary: Update equipment
      parameters:
        - $ref: "#/components/parameters/EquipmentId"
        - $ref: "#/components/parameters/IfMatch"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateEquipmentRequest"
      responses:
        "200":
          description: Equipment updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EquipmentSummary"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: Version conflict
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /api/v1/equipment/{id}/move:
    post:
      tags: [Equipment]
      summary: Move equipment to another site or tunnel
      parameters:
        - $ref: "#/components/parameters/EquipmentId"
        - $ref: "#/components/parameters/IfMatch"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MovementRequest"
      responses:
        "200":
          description: Equipment moved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EquipmentSummary"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: Version conflict
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /api/v1/equipment/{id}/status:
    post:
      tags: [Status]
      summary: Record an equipment status event
      description: |
        Appends an immutable status event. The event is projected onto the
        equipment only when it is the newest event by occurredAt. Late events
        remain in history but do not regress the current status.
      parameters:
        - $ref: "#/components/parameters/EquipmentId"
        - $ref: "#/components/parameters/IfMatch"
        - name: Idempotency-Key
          in: header
          required: true
          schema:
            type: string
            maxLength: 200
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RecordStatusRequest"
      responses:
        "201":
          description: Status event recorded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StatusResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: Equipment version conflict
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "428":
          $ref: "#/components/responses/PreconditionRequired"

  /api/v1/equipment/{id}/status-events:
    get:
      tags: [Status]
      summary: Get equipment status history
      parameters:
        - $ref: "#/components/parameters/EquipmentId"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Status events ordered by occurredAt descending
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/StatusEventView"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/active-problems:
    get:
      tags: [Status]
      summary: List equipment currently down or under repair
      parameters:
        - $ref: "#/components/parameters/SiteIdQuery"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Active problem status events
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/StatusEventView"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/v1/events:
    get:
      tags: [Status]
      summary: Stream equipment status events
      description: |
        Server-sent events endpoint. Send Last-Event-ID as
        "<recordedAt>|<eventId>" to resume after a known event.
      parameters:
        - name: Last-Event-ID
          in: header
          required: false
          schema:
            type: string
      responses:
        "200":
          description: text/event-stream of equipment-status events
          content:
            text/event-stream:
              schema:
                type: string
        "400":
          $ref: "#/components/responses/BadRequest"

  /api/v1/import-profiles:
    get:
      tags: [Imports]
      summary: List import profiles
      responses:
        "200":
          description: Import profiles
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ImportProfileView"
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      tags: [Imports]
      summary: Create an import profile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateImportProfileRequest"
      responses:
        "201":
          description: Import profile created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ImportProfileView"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          description: Import profile already exists
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /api/v1/imports:
    post:
      tags: [Imports]
      summary: Preview an Excel workbook
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [profileId, file]
              properties:
                profileId:
                  type: string
                  format: uuid
                file:
                  type: string
                  format: binary
      responses:
        "201":
          description: Import preview created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ImportBatchView"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "413":
          description: Workbook exceeds 20 MiB
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /api/v1/imports/{id}:
    get:
      tags: [Imports]
      summary: Page through import rows
      parameters:
        - $ref: "#/components/parameters/ImportId"
        - name: from
          in: query
          schema:
            type: integer
            default: 1
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Import rows
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ImportRowsPage"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/imports/{id}/commit:
    post:
      tags: [Imports]
      summary: Commit an import preview
      parameters:
        - $ref: "#/components/parameters/ImportId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CommitImportRequest"
      responses:
        "200":
          description: Import committed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ImportBatchView"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          description: Import cannot be committed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /api/v1/imports/{id}/rejections.csv:
    get:
      tags: [Imports]
      summary: Download rejected import rows
      parameters:
        - $ref: "#/components/parameters/ImportId"
      responses:
        "200":
          description: CSV export
          content:
            text/csv:
              schema:
                type: string
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/inspections/expected:
    get:
      tags: [Inspections]
      summary: List open inspection expectations visible to the caller
      parameters:
        - $ref: "#/components/parameters/SiteIdQuery"
      responses:
        "200":
          description: Open expectations
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ExpectedInspectionView"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/v1/inspections/control:
    get:
      tags: [Inspections]
      summary: List inspection expectations for daily control
      parameters:
        - name: reportDate
          in: query
          schema:
            type: string
            format: date
        - $ref: "#/components/parameters/SiteIdQuery"
      responses:
        "200":
          description: Expectations for the period
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ExpectedInspectionView"
        "403":
          $ref: "#/components/responses/Forbidden"

